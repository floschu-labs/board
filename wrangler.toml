# Cloudflare configuration for self-hosting board with synced storage (D1).
# See CLOUDFLARE.md, or just use the "Deploy to Cloudflare" button in the README.
#
# Only read by wrangler / the Deploy button. No effect on `npm run dev`, the
# default `npm run build`, GitHub Pages, or the Docker self-host path.

name = "board"
main = "worker/index.js"
compatibility_date = "2025-08-20"

# Build the Cloudflare bundle (base '/', API storage) before every deploy, so the
# "Deploy to Cloudflare" button and `wrangler deploy` produce the right output
# regardless of any build command Cloudflare auto-detects.
[build]
command = "npm run build:cloudflare"

# Serve the built SPA (dist/) as static assets; the Worker handles /api/* first.
[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 (SQLite) binding used by worker/index.js.
# No database_id: the "Deploy to Cloudflare" button (and `wrangler deploy`)
# auto-provisions the database and writes its id back to this file for that
# deployment. Updating to a new release reuses the same database, so data
# persists.
[[d1_databases]]
binding = "DB"
database_name = "board"
