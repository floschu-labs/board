name: Update from upstream

# This runs in COPIES of floschu/board (e.g. those created by the "Deploy to
# Cloudflare" button), NOT in the upstream repo itself. It merges the latest
# upstream *release* into your copy, which triggers your Cloudflare redeploy.
#
# Your data is untouched: D1 is a separate resource, and the merge keeps your
# copy's wrangler.toml (with its auto-provisioned database id). Delete this file
# if you'd rather update manually (GitHub's "Sync fork" button).

on:
  schedule:
    - cron: "27 5 * * *" # daily, ~05:27 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    # Never run on the upstream repo.
    if: github.repository != 'floschu/board'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge latest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/floschu/board.git
          git fetch upstream --tags --quiet

          # Track the newest published *release* (a tag) — never develop, so
          # unreleased/in-progress commits are not pulled in.
          latest=$(gh release view --repo floschu/board --json tagName -q .tagName)
          echo "Latest upstream release: $latest"

          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "Already on the latest release."
            exit 0
          fi

          # Merge only that release commit. A clean merge keeps your wrangler.toml
          # (with its auto-provisioned database id), because upstream never sets
          # the id. If a release changes something you also changed, we abort and
          # ask you to resolve it manually — we never silently drop upstream
          # changes (so security fixes can't be dropped without you noticing).
          if ! git merge --no-edit "$latest"; then
            git merge --abort
            echo "::error::Could not merge $latest cleanly. Update manually via GitHub's 'Sync fork' and resolve the conflict."
            exit 1
          fi

          if ! git push origin HEAD; then
            echo "::error::Push was rejected (branch protection on the default branch?). Merge $latest manually, or relax protection so this workflow can push."
            exit 1
          fi
